<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>مدیریت املاک | املاک امیر پاشا</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#f4f6f9;
 color:#0b1220;
 font-family:Arial,sans-serif;
 line-height:1.8
}
.wrap{
 max-width:900px;
 margin:auto;
 padding:20px 14px 50px
}
.card{
 background:#fff;
 border:1px solid #e5e9ef;
 border-radius:20px;
 padding:18px;
 margin-bottom:15px;
 box-shadow:0 10px 30px #0000000a
}
h1,h2{margin-top:0}
input,select,textarea{
 width:100%;
 padding:12px;
 border:1px solid #d8dee7;
 border-radius:12px;
 margin:6px 0 12px;
 background:#fff;
 font:inherit
}
textarea{
 min-height:120px;
 resize:vertical
}
button{
 border:0;
 border-radius:12px;
 padding:11px 16px;
 font:inherit;
 font-weight:bold;
 cursor:pointer
}
.primary{
 background:#0b1220;
 color:#fff
}
.green{
 background:#eaf8ef;
 color:#14723c
}
.red{
 background:#feeceb;
 color:#a61b1b
}
.gray{
 background:#edf0f4;
 color:#18202c
}
.grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px
}
.row{
 display:flex;
 gap:8px;
 flex-wrap:wrap
}
.photo-list{
 display:flex;
 gap:8px;
 overflow:auto;
 padding:5px 0
}
.photo-box{
 position:relative;
 flex:0 0 100px
}
.photo-box img{
 width:100px;
 height:80px;
 object-fit:cover;
 border-radius:10px
}
.photo-box button{
 position:absolute;
 top:3px;
 left:3px;
 padding:2px 7px;
 background:#b42318;
 color:#fff
}
.item{
 border-top:1px solid #eee;
 padding:15px 0
}
.item:first-child{border-top:0}
.muted{
 color:#687281;
 font-size:12px
}
.status{
 padding:3px 8px;
 border-radius:20px;
 font-size:11px
}
.on{
 background:#eaf8ef;
 color:#14723c
}
.off{
 background:#edf0f4;
 color:#555
}
.hidden{display:none!important}
#message{
 padding:10px;
 border-radius:10px;
 margin:10px 0;
 display:none
}
.okmsg{
 display:block!important;
 background:#eaf8ef;
 color:#14723c
}
.errmsg{
 display:block!important;
 background:#feeceb;
 color:#a61b1b
}
@media(max-width:650px){
 .grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="wrap">

<div class="card">

<h1>پنل مدیریت املاک امیر پاشا</h1>

<div class="muted">
مدیریت آگهی‌ها و تصاویر از طریق GitHub
</div>

</div>

<div class="card">

<h2>⚙️ اتصال به GitHub</h2>

<label>نام کاربری GitHub</label>
<input id="githubUser" placeholder="مثلاً amirpasha">

<label>نام Repository</label>
<input id="githubRepo" placeholder="مثلاً amlak">

<label>Branch</label>
<input id="githubBranch" value="main">

<label>GitHub Token</label>
<input
 id="githubToken"
 type="password"
 placeholder="توکن GitHub"
>

<div class="muted">
توکن فقط در همین نشست مرورگر استفاده می‌شود و در فایل سایت ذخیره نمی‌شود.
</div>

<div class="row">

<button class="primary" onclick="saveConfig()">
ذخیره اتصال
</button>

<button class="gray" onclick="clearConfig()">
پاک کردن اطلاعات
</button>

</div>

</div>

<div id="app">

<div class="card">

<h2>➕ افزودن آگهی</h2>

<label>عنوان آگهی</label>
<input id="title" placeholder="مثلاً آپارتمان ۸۰ متری مهستان">

<div class="grid">

<div>
<label>نوع ملک</label>
<select id="type">
<option value="apartment">آپارتمان</option>
<option value="villa">ویلا</option>
<option value="mehr">مسکن مهر</option>
<option value="land">زمین</option>
</select>
</div>

<div>
<label>متراژ</label>
<input id="area" type="number" placeholder="80">
</div>

<div>
<label>قیمت</label>
<input id="price" placeholder="مثلاً ۲ میلیارد تومان">
</div>

<div>
<label>خواب</label>
<input id="bedrooms" type="number" placeholder="2">
</div>

<div>
<label>طبقه</label>
<input id="floor" placeholder="3">
</div>

<div>
<label>فاز</label>
<input id="phase" placeholder="مثلاً فاز ۱">
</div>

</div>

<label>موقعیت</label>
<input id="location" placeholder="مهستان، ...">

<label>توضیحات</label>
<textarea
 id="description"
 placeholder="توضیحات کامل ملک..."
></textarea>

<label>مدارک</label>
<input
 id="documents"
 placeholder="مثلاً سند تک‌برگ"
>

<label>تصاویر</label>
<input
 id="photos"
 type="file"
 accept="image/*"
 multiple
>

<div id="photoPreview" class="photo-list"></div>

<div class="row">

<button class="primary" onclick="addListing()">
ثبت آگهی
</button>

<button class="gray" onclick="resetForm()">
پاک کردن فرم
</button>

</div>

</div>

<div class="card">

<h2>📋 آگهی‌ها</h2>

<div id="listings">
برای مشاهده آگهی‌ها ابتدا اتصال GitHub را ذخیره کنید.
</div>

</div>

</div>

<div id="message"></div>

</div>

<script>

let config =
 JSON.parse(
  sessionStorage.getItem('github_config') || 'null'
 );

let selectedFiles = [];

const $ = id =>
 document.getElementById(id);

function message(text,ok=true){

 const box = $('message');

 box.textContent = text;

 box.className =
  ok ? 'okmsg' : 'errmsg';

 box.style.display='block';

 setTimeout(()=>{
  box.style.display='none';
 },5000);
}

function saveConfig(){

 const user =
  $('githubUser').value.trim();

 const repo =
  $('githubRepo').value.trim();

 const branch =
  $('githubBranch').value.trim();

 const token =
  $('githubToken').value.trim();

 if(!user || !repo || !branch || !token){

  message(
   'همه اطلاعات اتصال را وارد کنید.',
   false
  );

  return;
 }

 config={
  user,
  repo,
  branch,
  token
 };

 sessionStorage.setItem(
  'github_config',
  JSON.stringify(config)
 );

 message('اتصال ذخیره شد.');

 loadListings();
}

function clearConfig(){

 sessionStorage.removeItem(
  'github_config'
 );

 config=null;

 $('githubToken').value='';

 message('اطلاعات اتصال پاک شد.');
}

function loadConfig(){

 if(!config)
  return;

 $('githubUser').value=config.user;
 $('githubRepo').value=config.repo;
 $('githubBranch').value=config.branch;
 $('githubToken').value=config.token;

 loadListings();
}

async function github(path,options={}){

 if(!config)
  throw new Error(
   'ابتدا اتصال GitHub را تنظیم کنید.'
  );

 const url =
  `https://api.github.com/repos/${encodeURIComponent(config.user)}/${encodeURIComponent(config.repo)}/${path}`;

 options.headers={
  Accept:'application/vnd.github+json',
  Authorization:`Bearer ${config.token}`,
  'X-GitHub-Api-Version':'2022-11-28',
  ...(options.headers||{})
 };

 const response =
  await fetch(url,options);

 const data =
  await response.json().catch(
   ()=>({})
  );

 if(!response.ok){

  throw new Error(
   data.message ||
   'خطا در ارتباط با GitHub'
  );
 }

 return data;
}

async function getFile(path){

 return github(
  `contents/${path}?ref=${encodeURIComponent(config.branch)}`
 );
}

async function getListings(){

 try{

  const file =
   await getFile('data/listings.json');

  const binary =
   atob(file.content.replace(/\n/g,''));

  const bytes =
   Uint8Array.from(
    binary,
    c=>c.charCodeAt(0)
   );

  const text =
   new TextDecoder().decode(bytes);

  const data =
   JSON.parse(text);

  return {
   data,
   sha:file.sha
  };

 }catch(e){

  if(
   String(e.message)
   .toLowerCase()
   .includes('not found')
  ){

   return {
    data:{listings:[]},
    sha:null
   };

  }

  throw e;
}

function utf8ToBase64(str){

 const bytes =
  new TextEncoder().encode(str);

 let binary='';

 bytes.forEach(
  b=>binary+=String.fromCharCode(b)
 );

 return btoa(binary);
}

function fileToBase64(file){

 return new Promise(
  (resolve,reject)=>{

   const reader =
    new FileReader();

   reader.onload=()=>{

    const result =
     reader.result;

    resolve(
     result.split(',')[1]
    );

   };

   reader.onerror=reject;

   reader.readAsDataURL(file);
  }
 );
}

async function saveListings(data,sha){

 const content =
  JSON.stringify(
   data,
   null,
   2
  );

 const body={
  message:'Update listings',
  content:utf8ToBase64(content),
  branch:config.branch
 };

 if(sha)
  body.sha=sha;

 return github(
  'contents/data/listings.json',
  {
   method:'PUT',
   body:JSON.stringify(body)
  }
 );
}

async function uploadImage(file){

 const safeName =
  file.name
  .toLowerCase()
  .replace(
   /[^a-z0-9._-]/g,
   '-'
  );

 const filename =
  `${Date.now()}-${Math.random()
   .toString(36)
   .slice(2,8)}-${safeName}`;

 const path =
  `images/listings/${filename}`;

 const content =
  await fileToBase64(file);

 const result =
  await github(
   `contents/${path}`,
   {
    method:'PUT',
    body:JSON.stringify({
     message:`Upload property image ${filename}`,
     content,
     branch:config.branch
    })
   }
  );

 return result.content.download_url;
}

async function addListing(){

 if(!config){

  message(
   'ابتدا اتصال GitHub را تنظیم کنید.',
   false
  );

  return;
 }

 const title =
  $('title').value.trim();

 if(!title){

  message(
   'عنوان آگهی را وارد کنید.',
   false
  );

  return;
 }

 const button =
  document.querySelector(
   '[onclick="addListing()"]'
  );

 button.disabled=true;
 button.textContent='در حال ثبت...';

 try{

  const images=[];

  for(
   const file of selectedFiles
  ){

   if(file.size > 10*1024*1024)
    throw new Error(
     'حجم هر عکس باید کمتر از ۱۰ مگابایت باشد.'
    );

   const url =
    await uploadImage(file);

   images.push(url);
  }

  const current =
   await getListings();

  const listing={

   id:
    Date.now(),

   title,

   property_type:
    $('type').value,

   area:
    $('area').value,

   price:
    $('price').value,

   bedrooms:
    $('bedrooms').value,

   floor:
    $('floor').value,

   phase:
    $('phase').value,

   location:
    $('location').value,

   documents:
    $('documents').value,

   description:
    $('description').value,

   photos:
    images,

   published:true,

   created_at:
    new Date().toISOString()

  };

  current.data.listings.push(
   listing
  );

  await saveListings(
   current.data,
   current.sha
  );

  message(
   'آگهی با موفقیت ثبت شد.'
  );

  resetForm();

  loadListings();

 }catch(e){

  message(
   e.message,
   false
  );

 }finally{

  button.disabled=false;
  button.textContent='ثبت آگهی';
 }
}

async function loadListings(){

 if(!config)
  return;

 const box =
  $('listings');

 box.textContent=
  'در حال دریافت آگهی‌ها...';

 try{

  const result =
   await getListings();

  const list =
   result.data.listings || [];

  if(!list.length){

   box.innerHTML=
    '<div class="muted">هنوز آگهی‌ای ثبت نشده است.</div>';

   return;
  }

  box.innerHTML =
   list.map(
    x=>`

    <div class="item">

     <h3>
      ${escapeHtml(x.title)}
     </h3>

     <div class="muted">

      ${escapeHtml(
       x.location || ''
      )}

      ·

      ${escapeHtml(
       x.area || ''
      )}

      متر

     </div>

     <p>
      ${escapeHtml(
       x.price || 'تماس بگیرید'
      )}
     </p>

     <div class="photo-list">

      ${
       (x.photos||[])
       .map(
        p=>`
         <img
          src="${escapeHtml(p)}"
          style="
           width:100px;
           height:80px;
           object-fit:cover;
           border-radius:10px
          "
         >
        `
       )
       .join('')
      }

     </div>

     <div class="row">

      <button
       class="red"
       onclick="deleteListing(${x.id})"
      >
       حذف
      </button>

     </div>

    </div>

   `
   ).join('');

 }catch(e){

  box.innerHTML=
   `<div class="errmsg">${escapeHtml(e.message)}</div>`;

 }
}

async function deleteListing(id){

 if(
  !confirm(
   'این آگهی حذف شود؟'
  )
 )
  return;

 try{

  const result =
   await getListings();

  result.data.listings =
   result.data.listings.filter(
    x=>x.id!==id
   );

  await saveListings(
   result.data,
   result.sha
  );

  message(
   'آگهی حذف شد.'
  );

  loadListings();

 }catch(e){

  message(
   e.message,
   false
  );
 }
}

function escapeHtml(value){

 return String(value ?? '')
  .replace(
   /[&<>"']/g,
   c=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#039;'
   }[c])
  );
}

function resetForm(){

 [
  'title',
  'area',
  'price',
  'bedrooms',
  'floor',
  'phase',
  'location',
  'documents',
  'description'
 ].forEach(
  id=>$(id).value=''
 );

 $('photos').value='';

 selectedFiles=[];

 $('photoPreview').innerHTML='';
}

$('photos').addEventListener(
 'change',
 e=>{

  selectedFiles =
   Array.from(e.target.files);

  $('photoPreview').innerHTML =
   '';

  selectedFiles.forEach(
   file=>{

    const url =
     URL.createObjectURL(file);

    const box =
     document.createElement('div');

    box.className='photo-box';

    box.innerHTML=`
     <img src="${url}">
    `;

    $('photoPreview')
     .appendChild(box);
   }
 );

 });

loadConfig();

</script>

</body>
</html>
